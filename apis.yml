name: Instaplay
description: Instaplay is an AI-native social gaming platform that turns plain-text prompts
  into playable multiplayer games with no coding required. Users describe a game idea
  in natural language ("a two-player pong game where paddles shrink after every point")
  and the platform generates a playable prototype that can be tested, remixed, and shared
  via link within seconds. It supports party, co-op, competitive, local, online, and solo
  formats. Founded in San Francisco and part of Y Combinator's Summer 2026 batch, Instaplay
  frames games as a training ground for world models and embodied agents on the path to AGI.
